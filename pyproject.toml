[project]
name = "callsense"
version = "0.1.0"
description = "Structured analysis of customer support call transcripts with Claude, plus an eval harness."
readme = "README.md"
authors = [
    { name = "DeekshithaDondeti", email = "deekshithadondeti19@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "fastembed>=0.9.1",
    "openai>=3.60.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
callsense = "callsense:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
