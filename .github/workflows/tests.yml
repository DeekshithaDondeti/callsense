name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0  # setup-uv publishes only full version tags

      - name: Install dependencies
        run: uv sync --locked

      # Tests use a fake Claude client: no API key is needed and no credits are spent.
      - name: Run tests
        run: uv run pytest -q
