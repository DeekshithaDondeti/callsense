# Local Postgres with pgvector for CallSense. Only reachable from this machine.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: callsense
      POSTGRES_USER: callsense
      # Local development only. The database holds synthetic data and listens on 127.0.0.1.
      POSTGRES_PASSWORD: ${CALLSENSE_DB_PASSWORD:-callsense-local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callsense -d callsense"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
